name: Sync Hugging Face Space

# Hugging Face deployment is intentionally manual. The free Colab path is the
# primary zero-cost development/test path and does not require a Hugging Face account.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-space-sync
  cancel-in-progress: false

env:
  HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO || 'rampaulsaini/yatharth-music-ai' }}

jobs:
  sync:
    name: Sync Gradio adapter to Hugging Face
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_SPACE_REPO" || { echo "Missing Hugging Face Space repository id."; exit 1; }
          test -n "$HF_TOKEN" || { echo "Missing repository secret HF_TOKEN."; exit 1; }
          echo "Hugging Face Space target: $HF_SPACE_REPO"

      - name: Sync Space files
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ env.HF_SPACE_REPO }}
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: gradio
          subdirectory: hf_space
