name: Sync Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "hf_space/**"
      - ".github/workflows/sync-huggingface-space.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync Gradio adapter to Hugging Face
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        env:
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_SPACE_REPO" || { echo "Missing repository variable HF_SPACE_REPO (example: username/yatharth-music-ai)."; exit 1; }
          test -n "$HF_TOKEN" || { echo "Missing repository secret HF_TOKEN."; exit 1; }

      - name: Sync Space files
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ vars.HF_SPACE_REPO }}
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: gradio
          subdirectory: hf_space
