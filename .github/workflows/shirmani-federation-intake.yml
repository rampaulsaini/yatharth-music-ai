name: Shirmani Federation - Creative Studio Intake

on:
  repository_dispatch:
    types: [yatharth_studio_request]
  workflow_dispatch:
    inputs:
      brief:
        description: "Creative brief"
        required: true
        type: string
      format:
        description: "Production format"
        required: false
        default: "animated-film"
        type: string

permissions:
  contents: write

concurrency:
  group: shirmani-federation-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate approved federation source
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          SOURCE_WORKFLOW: ${{ github.event.client_payload.source_workflow }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            test "$SOURCE_REPOSITORY" = "rampaulsaini/Shirmani-Research-Institute-Shirmani-Research-Institute-"
            case "$SOURCE_WORKFLOW" in
              "yatharth-creative-studio-bridge"|"SHIRMANI Inter-Repository Automission Orchestrator")
                ;;
              *)
                echo "Unsupported federation source workflow: $SOURCE_WORKFLOW"
                exit 1
                ;;
            esac
          fi
          echo "Approved federation source."

      - name: Build federation receipt and automission hand-off
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRIEF: ${{ inputs.brief }}
          FORMAT: ${{ inputs.format }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          SOURCE_WORKFLOW: ${{ github.event.client_payload.source_workflow }}
          SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
          AUTOMATION_MODE: ${{ github.event.client_payload.automation_mode }}
        run: |
          set -euo pipefail
          mkdir -p federation/inbox federation/outbox automation/inbox
          export BRIEF FORMAT SOURCE_REPOSITORY SOURCE_WORKFLOW SOURCE_RUN_ID AUTOMATION_MODE EVENT_NAME GITHUB_RUN_ID
          python - <<'PY'
          import json, os, re
          from datetime import datetime, timezone
          from pathlib import Path

          stamp = datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          run_id = os.getenv("SOURCE_RUN_ID", "").strip() or os.getenv("GITHUB_RUN_ID", "manual")
          brief = os.getenv("BRIEF", "").strip()
          fmt = (os.getenv("FORMAT") or "animated-film").strip().lower()
          allowed = {"animated-film", "animated-short", "music-video", "story-film"}

          if not brief:
              raise SystemExit("Creative brief is required.")
          if len(brief) > 12000:
              raise SystemExit("Creative brief exceeds the 12000-character safety limit.")
          if fmt not in allowed:
              raise SystemExit(f"Unsupported production format: {fmt}")

          safe_mode = re.sub(r"[^A-Za-z0-9_.-]", "_", os.getenv("AUTOMATION_MODE") or "MANUAL")[:32]
          source_run_id = re.sub(r"[^0-9A-Za-z_.-]", "-", run_id)

          payload = {
            "schema_version": 1,
            "handoff_id": f"{stamp}-{source_run_id}",
            "received_at": datetime.now(timezone.utc).isoformat(),
            "source_repository": os.getenv("SOURCE_REPOSITORY") or "manual",
            "source_workflow": os.getenv("SOURCE_WORKFLOW") or "manual",
            "source_run_id": run_id,
            "automation_mode": safe_mode,
            "brief": brief,
            "format": fmt,
            "status": "ACCEPTED",
            "next_action": "open-in-yatharth-creative-studio",
            "pipeline": ["story","characters","storyboard","music","animation","editing","quality-review"],
            "policies": {
              "approved_source_only": True,
              "no_secret_exposure": True,
              "no_fabricated_rendering_claims": True,
              "human_review_before_publication": True,
              "provider_neutral_adapters": True
            }
          }

          with open(f"federation/inbox/{stamp}-{source_run_id}.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
          with open(f"federation/outbox/{stamp}-{source_run_id}.json", "w", encoding="utf-8") as f:
              json.dump({**payload, "status": "READY_FOR_STUDIO", "studio_route": "/studio.html"}, f, ensure_ascii=False, indent=2)

          receipt = {
            "schema": "yatharth-studio-automission-receipt/v1",
            "status": "RECEIVED",
            "independent_verification_claim": False,
            "received_at_utc": datetime.now(timezone.utc).isoformat(),
            "receiver_repository": os.getenv("GITHUB_REPOSITORY", ""),
            "receiver_run_id": os.getenv("GITHUB_RUN_ID", ""),
            "source_repository": os.getenv("SOURCE_REPOSITORY") or "manual",
            "source_workflow": os.getenv("SOURCE_WORKFLOW") or "manual",
            "source_run_id": run_id,
            "automation_mode": safe_mode,
            "brief": brief,
            "format": fmt
          }

          receipt_path = Path("automation/inbox") / f"yatharth-studio-request-{source_run_id}.json"
          receipt_path.write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit intake receipt
        run: |
          set -euo pipefail
          git config user.name "Yatharth Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/inbox federation/inbox federation/outbox
          git diff --cached --quiet || git commit -m "fix(automission): align federation receiver receipt contract"
          git push

      - name: Validate Creative Studio contract
        run: python scripts/validate-creative-studio.py
