name: Receive Yatharth Studio Automission Request

on:
  repository_dispatch:
    types:
      - yatharth_studio_request

permissions:
  contents: write

concurrency:
  group: yatharth-studio-receipt
  cancel-in-progress: false

jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate and persist source receipt
        uses: actions/github-script@v7
        env:
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          SOURCE_WORKFLOW: ${{ github.event.client_payload.source_workflow }}
          SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
          AUTOMATION_MODE: ${{ github.event.client_payload.automation_mode }}
          BRIEF: ${{ github.event.client_payload.brief }}
          FORMAT: ${{ github.event.client_payload.format }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runId = (process.env.SOURCE_RUN_ID || '').trim();
            const sourceRepository = (process.env.SOURCE_REPOSITORY || '').trim();
            const sourceWorkflow = (process.env.SOURCE_WORKFLOW || '').trim();
            const format = (process.env.FORMAT || '').trim();

            if (!/^\d+$/.test(runId)) {
              core.setFailed('Invalid source_run_id; receipt not written.');
              return;
            }
            if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(sourceRepository)) {
              core.setFailed('Invalid source_repository; receipt not written.');
              return;
            }
            if (!sourceWorkflow) {
              core.setFailed('Missing source_workflow; receipt not written.');
              return;
            }

            const allowedFormats = new Set([
              'animated-film',
              'animated-short',
              'music-video',
              'story-film'
            ]);
            if (!allowedFormats.has(format)) {
              core.setFailed(`Unsupported production format: ${format}`);
              return;
            }

            const receipt = {
              status: 'RECEIVED',
              source_repository: sourceRepository,
              source_workflow: sourceWorkflow,
              source_run_id: runId,
              automation_mode: process.env.AUTOMATION_MODE || 'CONTINUOUS',
              brief: process.env.BRIEF || '',
              format,
              receiver_repository: context.repo.owner + '/' + context.repo.repo,
              receiver_workflow: context.workflow,
              receiver_run_id: String(context.runId),
              received_at: new Date().toISOString(),
              independent_verification_claim: false
            };

            const path = `automation/inbox/yatharth-studio-request-${runId}.json`;
            const content = Buffer.from(
              JSON.stringify(receipt, null, 2) + '\n',
              'utf8'
            ).toString('base64');

            let existingSha = null;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: 'main'
              });
              const item = Array.isArray(existing.data) ? existing.data[0] : existing.data;
              existingSha = item && item.sha ? item.sha : null;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `automation: receipt for source run ${runId}`,
              content,
              branch: 'main',
              ...(existingSha ? { sha: existingSha } : {})
            });

            core.summary
              .addHeading('Yatharth Studio Request Receipt')
              .addTable([
                [{data: 'Field', header: true}, {data: 'Value', header: true}],
                ['Status', receipt.status],
                ['Source', sourceRepository],
                ['Source run', runId],
                ['Format', format],
                ['Independent verification claim', 'false']
              ])
              .write();

            core.info(`Persisted receiver receipt: ${path}`);
