name: Resilience Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall main.py resilience.py tests
      - run: pytest -q tests/test_resilience.py tests/test_api.py

  live-probe:
    if: ${{ vars.YATHARTH_HEALTH_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe liveness
        env:
          HEALTH_URL: ${{ vars.YATHARTH_HEALTH_URL }}
        run: |
          python - <<'PY'
          import os, urllib.request, json
          base = os.environ["HEALTH_URL"].rstrip("/")
          with urllib.request.urlopen(base + "/api/health", timeout=15) as r:
              data = json.load(r)
          assert data.get("ok") is True, data
          print("health:", data)
          try:
              urllib.request.urlopen(base + "/api/ready", timeout=15)
              print("ready: 200")
          except Exception as exc:
              print("ready probe reported non-ready:", exc)
          PY
